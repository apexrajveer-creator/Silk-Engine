[Rainmeter]
Update=1000
[Variables]
@Include=#@#Variables.inc
[MeasureTime]
Measure=Time
Format=%H:%M
[MeasureDate]
Measure=Time
Format=%A, %d %B
[MeasureCPU]
Measure=CPU
[Style]
FontFace=#Font#
FontColor=#Colour#
AntiAlias=1
[Time]
Meter=String
MeterStyle=Style
MeasureName=MeasureTime
FontSize=#Size#
Text=%1
X=0
Y=0
[Date]
Meter=String
MeterStyle=Style
MeasureName=MeasureDate
FontSize=12
Text=%1
X=0
Y=64
[CPU]
Meter=String
MeterStyle=Style
MeasureName=MeasureCPU
FontSize=12
Text=CPU %1%
X=0
Y=100
[Bar]
Meter=Bar
MeasureName=MeasureCPU
BarColor=#Accent#
BarOrientation=Horizontal
X=0
Y=130
W=260
H=6
